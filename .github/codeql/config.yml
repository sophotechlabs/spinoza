name: spinoza

# Test code is never shipped, and the regex rules read a matcher like
# /cilium\.io/, the name of a sidebar button, as a check on a URL host.
paths-ignore:
  - frontend/test

query-filters:
  # Every logged value goes through slog's TextHandler, which escapes control
  # characters, so a newline cannot forge a second entry. The property belongs
  # to the handler set in main.go, not to any call site.
  # TestTheHandlerEscapesWhatItIsGiven pins it.
  - exclude:
      id: go/log-injection
