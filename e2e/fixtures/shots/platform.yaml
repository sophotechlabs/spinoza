apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: platform
  labels:
    app.kubernetes.io/name: node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
    spec:
      containers:
        - name: agent
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: platform
  labels:
    app.kubernetes.io/name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      containers:
        - name: gateway
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 40m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: observability
  labels:
    app.kubernetes.io/name: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector
    spec:
      containers:
        - name: collector
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 30m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 192Mi
