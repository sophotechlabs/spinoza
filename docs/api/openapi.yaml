openapi: 3.1.0
info:
  title: Spinoza
  summary: The http api the spinoza frontend and the mcp server speak
  description: |
    Hand-kept. A test in internal/server checks that every route in routes.go
    appears here and that nothing here is a route spinoza does not serve, so
    this file cannot drift away from what the binary answers.

    Every route needs the run token, as the X-Spinoza-Token header, a token
    query parameter, or the cookie the page keeps. When spinoza serves a
    cluster the session cookie takes its place and the role named on each
    route is enforced.
  version: 1
  license:
    name: FSL-1.1-ALv2
    url: https://spinoza.tech
servers:
  - url: /
    description: The address spinoza is listening on
paths:
  /api/access:
    get:
      summary: What this account may do to one object
      tags:
        - any-signed-in-reader
      responses:
        "200":
          description: What the route answers
        "400":
          description: The request was not understood
        "401":
          description: This run's token was not given
        "503":
          description: Spinoza has no cluster, or the cluster would not answer
    post:
      summary: The same, for several objects at once
      tags:
        - any-signed-in-reader
      responses:
        "200":
          description: What the route answers
        "400":
