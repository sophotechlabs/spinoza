[files]
extend-exclude = [
  "CHANGELOG.md",
  "frontend/node_modules/",
  "frontend/package-lock.json",
  "frontend/coverage/",
  "web/dist/",
  "dist/",
  "go.sum",
  "coverage.out",
]

[default]
# typos is here for prose. Hashes and hex identifiers are not prose: git commit
# ids in generated changelogs and the hex suffix kubernetes gives every event
# name will keep producing false hits forever, so they are ignored by shape.
extend-ignore-re = [
  "\\b[0-9a-f]{7,40}\\b",
  "\\.1[0-9a-f]{4,}\\b",
]

[default.extend-words]
crds = "crds"
iam = "iam"
ines = "ines"
ro = "ro"
unparseable = "unparseable"
Unparseable = "Unparseable"
