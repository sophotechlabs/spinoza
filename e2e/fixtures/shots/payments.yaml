apiVersion: v1
kind: Secret
metadata:
  name: ledger-credentials
  namespace: payments
type: Opaque
stringData:
  username: ledger
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: payments
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: payments
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: payments
  labels:
    app.kubernetes.io/name: ledger
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
    spec:
      containers:
        - name: ledger
          image: registry.k8s.io/pause:3.10
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ledger-credentials
                  key: username
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-settlement
  namespace: payments
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: settle
              image: registry.k8s.io/pause:3.10
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
