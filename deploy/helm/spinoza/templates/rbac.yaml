{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "spinoza.fullname" . }}
  labels:
    {{- include "spinoza.labels" . | nindent 4 }}
rules:
  {{- if eq .Values.rbac.read "everything" }}
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  {{- else }}
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps", "batch", "autoscaling", "policy", "networking.k8s.io", "storage.k8s.io", "discovery.k8s.io", "events.k8s.io", "apiextensions.k8s.io", "metrics.k8s.io", "scheduling.k8s.io", "node.k8s.io", "admissionregistration.k8s.io", "apiregistration.k8s.io", "coordination.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["*.toolkit.fluxcd.io", "argoproj.io", "cert-manager.io", "monitoring.coreos.com", "traefik.io", "gateway.networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
  {{- if .Values.impersonate }}
  {{- if .Values.rbac.impersonation.unsafeAllowAnyUser }}
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
  {{- else }}
  {{- with .Values.rbac.impersonation.users }}
  - apiGroups: [""]
    resources: ["users"]
    resourceNames:
      {{- toYaml . | nindent 6 }}
    verbs: ["impersonate"]
  {{- end }}
  {{- end }}
  {{- if .Values.rbac.impersonation.unsafeAllowAnyGroup }}
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
  {{- else }}
  {{- with .Values.rbac.impersonation.groups }}
  - apiGroups: [""]
    resources: ["groups"]
    resourceNames:
      {{- toYaml . | nindent 6 }}
    verbs: ["impersonate"]
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.rbac.write }}
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward", "pods/eviction", "pods/attach", "pods/ephemeralcontainers"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["nodes/proxy", "services/proxy", "pods/proxy"]
    verbs: ["get", "create"]
  {{- end }}
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "spinoza.fullname" . }}
  labels:
    {{- include "spinoza.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "spinoza.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "spinoza.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
