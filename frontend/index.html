<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinoza</title>
    <script>
      (function () {
        var root = document.documentElement;
        var stored = 'dark';
        var custom = null;
        try {
          stored = localStorage.getItem('spinoza.theme.v1') || 'dark';
          if (stored !== 'dark' && stored !== 'light' && stored !== 'system') {
            var installed = JSON.parse(localStorage.getItem('spinoza.themes.v1') || '[]');
            for (var i = 0; i < installed.length; i++) {
              if (installed[i] && installed[i].id === stored) {
                custom = installed[i];
              }
            }
          }
        } catch (err) {
          stored = 'dark';
        }
        var base = 'dark';
        if (custom && custom.base === 'light') {
          base = 'light';
        } else if (stored === 'light') {
          base = 'light';
        } else if (stored === 'system') {
          if (!window.matchMedia('(prefers-color-scheme: dark)').matches) {
            base = 'light';
          }
        }
        root.dataset.theme = base;
        root.style.colorScheme = base;
        if (custom && custom.tokens) {
          for (var token in custom.tokens) {
            if (Object.prototype.hasOwnProperty.call(custom.tokens, token)) {
              root.style.setProperty('--' + token, custom.tokens[token]);
            }
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
