<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Spinoza</title>
    <script>
      (function () {
        var root = document.documentElement;
        var stored = 'dark';
        var last = null;
        function settings() {
          try {
            if (typeof window.__SPINOZA_SETTINGS__ === 'string') {
              return JSON.parse(window.__SPINOZA_SETTINGS__);
            }
          } catch (err) {
            return null;
          }
          return null;
        }
        function value(key) {
          var served = settings();
          if (served && typeof served[key] === 'string') {
            return served[key];
          }
          try {
            return localStorage.getItem(key);
          } catch (err) {
            return null;
          }
        }
        try {
          stored = value('spinoza.theme.v1') || 'dark';
          if (stored !== 'dark' && stored !== 'light' && stored !== 'system') {
            last = JSON.parse(value('spinoza.painted.v1') || 'null');
          }
        } catch (err) {
          stored = 'dark';
        }
        var base = 'dark';
        if (last && last.base === 'light') {
          base = 'light';
        } else if (stored === 'light') {
          base = 'light';
        } else if (stored === 'system') {
          if (!window.matchMedia('(prefers-color-scheme: dark)').matches) {
            base = 'light';
          }
        }
        root.dataset.theme = base;
        root.style.colorScheme = base;
        if (last && last.tokens) {
          for (var token in last.tokens) {
            if (Object.prototype.hasOwnProperty.call(last.tokens, token)) {
              root.style.setProperty('--' + token, last.tokens[token]);
            }
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
