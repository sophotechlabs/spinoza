name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Validate the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -er '.headBranchName' <<< "$RELEASE_PR")
          number=$(jq -er '.number' <<< "$RELEASE_PR")
          workflows=(
            codeql.yaml
            commits.yaml
            frontend.yaml
            go-fuzz.yaml
            go-mutation.yaml
            go.yaml
            install.yaml
            integration.yaml
            repo.yaml
            windows.yaml
          )
          failed=0
          for workflow in "${workflows[@]}"; do
            if ! gh workflow run "$workflow" --ref "$branch"; then
              failed=1
            fi
          done
          if ! gh workflow run e2e.yaml --ref "$branch" -f pull_request="$number"; then
            failed=1
          fi
          exit "$failed"
