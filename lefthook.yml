pre-commit:
  parallel: true
  commands:
    go-fmt:
      glob: "*.go"
      run: PATH="$HOME/go/bin:$PATH" gofumpt -w {staged_files}
      stage_fixed: true
    frontend-fmt:
      root: "frontend/"
      run: node_modules/.bin/prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    secrets:
      run: gitleaks git --staged --no-banner --redact

commit-msg:
  commands:
    commitlint:
      run: npx --yes --package @commitlint/cli@21.2.2 --package @commitlint/config-conventional@21.2.2 commitlint --edit {1}
