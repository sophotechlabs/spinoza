name: go-mutation

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - deploy/helm/spinoza/Chart.yaml
      - wails.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{
    github.event_name == 'push' &&
    startsWith(github.event.head_commit.message, 'chore(main): release ') &&
    github.sha || 'latest' }}
  cancel-in-progress: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - root-default
          - root-desktop
          - cmd
          - internal-a-d
          - checks-a-e
          - checks-f-j
          - checks-k-o
          - checks-p-r
          - checks-s-t
          - checks-u-z
          - internal-e-l
          - internal-m-r
          - resources-a-f
          - resources-g-l
          - resources-m-r
          - resources-s-z
          - server-a-c
          - server-d-e
          - server-f
          - server-g-l
          - server-m-r
          - server-s-z
          - internal-s-z
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: just go go:github.com/go-gremlins/gremlins/cmd/gremlins
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-mutation-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mutation-${{ runner.os }}-
      - run: just mutation-shard '${{ matrix.shard }}' 'dist/mutation/${{ matrix.shard }}'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-mutation-${{ matrix.shard }}
          path: dist/mutation/${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  mutation-total:
    needs: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: just
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: go-mutation-*
          path: dist/mutation
          merge-multiple: true
      - run: just mutation-total dist/mutation
