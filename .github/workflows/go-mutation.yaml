name: go-mutation

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - deploy/helm/spinoza/Chart.yaml
      - wails.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - default
          - desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: just go go:github.com/go-gremlins/gremlins/cmd/gremlins
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-mutation-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mutation-${{ runner.os }}-
      - run: just mutation '${{ matrix.mode }}' 'dist/mutation/${{ matrix.mode }}.json'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-mutation-${{ matrix.mode }}
          path: dist/mutation/${{ matrix.mode }}.json
          if-no-files-found: error
