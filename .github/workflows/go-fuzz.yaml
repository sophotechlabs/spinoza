name: go-fuzz

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - deploy/helm/spinoza/Chart.yaml
      - wails.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{
    github.event_name == 'push' &&
    startsWith(github.event.head_commit.message, 'chore(main): release ') &&
    github.sha || 'latest' }}
  cancel-in-progress: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: .
            target: FuzzServingCheckPublicURL
          - package: ./internal/issues
            target: FuzzCursor
          - package: ./internal/auth
            target: FuzzRoleAuthorization
          - package: ./internal/access
            target: FuzzDecisionAggregation
          - package: ./internal/mcp
            target: FuzzProtocol
          - package: ./internal/mcp
            target: FuzzStdioFraming
          - package: ./internal/checks
            target: FuzzParseRules
          - package: ./internal/charts
            target: FuzzChartIndex
          - package: ./internal/charts
            target: FuzzFetchableRepositoryURL
          - package: ./internal/store
            target: FuzzTimelineCellsRoundTrip
          - package: ./internal/store
            target: FuzzHistoryLimit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: just go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-fuzz-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-fuzz-${{ runner.os }}-
      - run: just fuzz-one '${{ matrix.package }}' '${{ matrix.target }}'
