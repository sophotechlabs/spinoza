apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: sleeper
          image: {{ .Values.image }}
          command: ['sh', '-c', 'echo {{ .Values.greeting }}; sleep 3600']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
