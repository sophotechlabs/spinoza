name: e2e

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - deploy/helm/spinoza/Chart.yaml
      - wails.json
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number used to cancel superseded release validation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    e2e-${{ github.event.pull_request.number || inputs.pull_request || github.ref }}-${{
    github.event_name == 'push' &&
    startsWith(github.event.head_commit.message, 'chore(main): release ') &&
    github.sha || 'latest' }}
  cancel-in-progress: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.groups.outputs.browser }}
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: node
      - id: groups
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          args=(--base "$BASE" --head "$HEAD")
          if [[ "$HEAD_REF" == release-please--branches--main* ]]; then
            args+=(--all)
          fi
          if [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; then
            args+=(--push)
          fi
          changed=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || true)
          if printf '%s\n' "$changed" | grep -qx '.release-please-manifest.json'; then
            args+=(--all)
          fi
          selected=$(node e2e/scripts/select-groups.mjs "${args[@]}")
          browser=$(printf '%s' "$selected" | jq -c '{include: [.include[] | select(.runner == "playwright")]}')
          groups=$(printf '%s' "$selected" | jq -c '[.include[].group]')
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          printf 'Selected groups: %s\n' "$groups" >> "$GITHUB_STEP_SUMMARY"

  suite-contract:
    needs: select
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: node
      - run: node e2e/scripts/validate-suite.mjs

  browser:
    needs: select
    name: ${{ matrix.group.group }} / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.group.timeout }}
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
        group: ${{ fromJSON(needs.select.outputs.browser).include }}
    env:
      SPINOZA_KIND_CLUSTER: e2e-${{ matrix.group.group }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: just node go kind kubectl helm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('go.sum', 'e2e/package-lock.json') }}
          restore-keys: e2e-${{ runner.os }}-${{ matrix.browser }}-
      - env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_GROUP: ${{ matrix.group.group }}
        run: just test-e2e-group "$E2E_GROUP" "$E2E_BROWSER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: e2e-${{ matrix.group.group }}-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.tmp/*.log
          if-no-files-found: ignore
          retention-days: 14
      - run: just cluster-down
        if: always()

  cluster-mode-auth:
    needs: select
    if: contains(fromJSON(needs.select.outputs.groups), 'cluster-mode-auth')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: just go kind kubectl helm
      - run: just test-cluster-mode
      - run: just cluster-mode-down
        if: always()

  mcp-cli:
    needs: select
    if: contains(fromJSON(needs.select.outputs.groups), 'mcp-cli')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: just go kind kubectl helm
      - run: just test-integration MCP
      - run: just cluster-down
        if: always()

  distribution-desktop-install:
    needs: select
    if: contains(fromJSON(needs.select.outputs.groups), 'distribution-desktop-install')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install_args: just yq
      - run: just test-packaging test-verify-archives test-uninstall
